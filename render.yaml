# Render Blueprint: New → Blueprint → this repo. The free instance sleeps
# after 15 minutes without traffic and every room in memory goes with it, so
# this is for trying the game out, not for leaving it up. Fly (apps/server/
# fly.toml) is the always-on option.
services:
  - type: web
    name: dragoncraft-versus
    runtime: docker
    plan: free
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      # the Pages site, plus the Vite dev server for trying it from a laptop
      - key: ALLOWED_ORIGINS
        value: https://brunoborta.github.io,http://localhost:5173,http://localhost:5174
